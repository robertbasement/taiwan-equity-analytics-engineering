version: 2

models:
  - name: dim_security_master
    description: Latest certified TWSE/TPEx company-basic issuer-origin snapshot.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, market]
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: market
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEX']
      - name: issuer_origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DOMESTIC', 'FOREIGN_REGISTERED', 'UNKNOWN']
      - name: source_as_of_date
        tests: [not_null]
      - name: source_sha256
        tests: [not_null]
      - name: source_contract_valid
        tests: [not_null]

  - name: int_v1_fundamental_eligibility
    description: Single fail-closed eligibility boundary for V1 fundamental research.
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: issuer_origin
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DOMESTIC', 'FOREIGN_REGISTERED', 'UNKNOWN']
      - name: security_master_match_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MATCHED', 'UNMATCHED']
      - name: is_v1_fundamental_eligible
        tests: [not_null]
      - name: ineligibility_reason
        tests: [not_null]
