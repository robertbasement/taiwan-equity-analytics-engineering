version: 2

models:

  - name: mart_factor_research_daily
    description: >
      Canonical daily research dataset for the factor research platform.
      One row per date and ticker.

    columns:

      - name: date
        tests:
          - not_null

      - name: ticker
        tests:
          - not_null

      - name: d_close
        description: Adjusted closing price.

      - name: stock_return
        description: >
          Realized adjusted-close return from the ticker's immediately previous
          observed trading date to the current date. The first observation is null.

      - name: market_factor_return
        description: >
          Realized adjusted-close return for benchmark ticker 0050 on the same date.

      - name: yoy_growth
        description: >
          Revenue YoY growth. Unit must be standardized upstream.
          Do not infer unit from magnitude.

      - name: market_cap
        description: >
          Contemporaneous effective_close * shares_outstanding.
          Shares-outstanding unit must be documented upstream.

      - name: implied_growth
        description: >
          Canonical decimal implied growth from mart_expectation_dataset.

      - name: implied_growth_pct
        description: >
          Canonical display percentage from mart_expectation_dataset.
          Not equivalent to deprecated 3Y/5Y/10Y implied-growth fields.

    tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - ticker


  - name: mart_factor_research_monthly
    description: >
      Monthly point-in-time panel used directly by the Streamlit
      factor research application.

    columns:

      - name: rebalance_date
        tests:
          - not_null

      - name: ticker
        tests:
          - not_null

      - name: forward_return
        description: >
          Return from current rebalance date to the immediately next
          scheduled rebalance date, calculated from adjusted prices only
          after both fixed-date endpoints have observed positive raw closes
          and positive finite adjusted closes. Otherwise null.

      - name: current_raw_close
        description: Source-observed raw close on the common rebalance date.

      - name: next_raw_close
        description: Source-observed raw close on the next common rebalance date.

      - name: current_adjusted_close
        description: Adjusted close on the common rebalance date.

      - name: next_adjusted_close
        description: Adjusted close on the next common rebalance date.

      - name: current_endpoint_observed
        description: True only when current_raw_close is positive.
        tests:
          - not_null

      - name: next_endpoint_observed
        description: True only when next_raw_close is positive.
        tests:
          - not_null

      - name: forward_return_eligible
        description: >
          Post-formation Methodology A label gate. True only when both raw
          closes are observed and positive and both adjusted closes are
          positive and finite.
        tests:
          - not_null

      - name: market_return
        description: >
          0050 return from current rebalance date to next rebalance date.

    tests:

      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - rebalance_date
              - ticker
